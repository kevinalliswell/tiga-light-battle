name: Feature request
description: 提议一个适合儿童体验的新功能
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能会让哪一种游戏体验更清楚、更有趣或更容易操作？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: child-friendly
    attributes:
      label: 儿童友好检查
      options:
        - label: 这个提议适合 10-12 岁儿童理解和操作。
          required: true
        - label: 这个提议不依赖未授权的官方图片、模型、音乐或音效。
          required: true
